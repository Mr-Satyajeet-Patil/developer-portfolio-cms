# Free single-service deployment on Render.
# 1. Push this repository to GitHub.
# 2. Create a free PostgreSQL database at https://neon.com and copy its
#    connection string.
# 3. In Render: New + > Blueprint, select the repository, then paste the Neon
#    connection string when Render asks for DATABASE_URL.
#
# The backend serves the built React app, the API, the admin and media from one
# origin, so no CORS, extra static site or Docker image is needed.

services:
  - type: web
    name: my-portfolio
    runtime: python
    branch: backend
    plan: free
    region: singapore
    buildCommand: bash build.sh
    startCommand: gunicorn --chdir backend myproject.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: NODE_VERSION
        value: "22.17.1"
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: .onrender.com
